# M5Stack ATOM Lite -> Home Assistant Bluetooth proxy
# Layered on ESPHome's officially maintained package for this exact board:
#   https://github.com/esphome/bluetooth-proxies/blob/main/m5stack/m5stack-atom-lite.yaml
# That package supplies esp32_ble_tracker + bluetooth_proxy (both active),
# safe-mode and factory-reset buttons. Everything below is your own layer.

substitutions:
  name: bt-proxy
  friendly_name: BT Proxy

packages:
  esphome.bluetooth-proxy: github://esphome/bluetooth-proxies/m5stack/m5stack-atom-lite.yaml@main

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Recovery AP if it ever loses Wi-Fi
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

api:
  encryption:
    key: "wfLBogcYKFBrmsx5zCssehNAYkUq31ZUbxZKhm5/0ak="

# The package already defines an OTA block; extend it to add a password.
ota:
  - id: !extend ota_esphome
    password: "c470e93b4ea9f42050689548"

# On-board SK6812 RGB LED -- handy "is it alive" indicator.
# Delete this block if you'd rather keep the firmware minimal.
light:
  - platform: esp32_rmt_led_strip
    name: "Status LED"
    id: status_led
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic
