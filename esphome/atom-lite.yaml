substitutions:
  name: atom-lite
  friendly_name: Atom Lite

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  board: m5stack-atom          # ESP32-PICO-D4, 4 MB flash, no PSRAM

logger:

# ---- Home Assistant native API ----
api:
  encryption:
    key: "mwW3YftKQYRk+0QHrWNHRPcnpx4H4+P0nZycsT7+CJA="

ota:
  - platform: esphome
    password: "bf9fead0a27975ecb5b15cb3"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If Wi-Fi drops, the board serves its own AP so you can recover it.
  ap:
    ssid: "${friendly_name} Setup"

captive_portal:

# =========================================================
#  On-board hardware (M5Stack ATOM Lite)
# =========================================================

# Front face button
binary_sensor:
  - platform: gpio
    name: "Button"
    id: atom_button
    pin:
      number: GPIO39
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms

# The single SK6812 RGB LED behind the button
light:
  - platform: esp32_rmt_led_strip
    name: "LED"
    id: atom_led
    pin: GPIO27
    num_leds: 1
    chipset: SK6812
    rgb_order: GRB

# On-board IR blaster LED -- lets HA send IR codes
remote_transmitter:
  - id: ir_tx
    pin: GPIO12
    carrier_duty_percent: 50%

# =========================================================
#  Diagnostics
# =========================================================
sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
    entity_category: diagnostic
  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      entity_category: diagnostic

button:
  - platform: restart
    name: "Restart"
    entity_category: config
