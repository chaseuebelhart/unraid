# Wins Watch — episode stills: top bar + runtime. Codec chips come from generated/chips_episodes.yml.
# Kometa composes episode art on a 1920x1080 canvas, so sizes/offsets here are 1.92x the poster spec (46px -> 88px, 40 -> 77).
overlays:
  ww_bar:
    builder_level: episode
    plex_all: true
    overlay:
      name: ww_bar
      file: config/winswatch/assets/bar_top.png
      horizontal_align: center
      horizontal_offset: 0
      vertical_align: top
      vertical_offset: 0

  ww_runtime:
    builder_level: episode
    plex_all: true
    overlay:
      name: text(<<runtime>>m)
      font: config/winswatch/fonts/Avenir_95_Black.ttf
      font_size: 88
      font_color: "#ffffff"
      back_color: "#00000000"
      horizontal_align: right
      horizontal_offset: 77
      vertical_align: top
      vertical_offset: 65
