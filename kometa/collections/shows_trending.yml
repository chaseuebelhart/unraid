# Wins Watch Home row 2 (MDBList list). collection_order: random is kept from the pre-Home file; `custom` would keep the list rank.
collections:
  🔥 Trending Shows:
    summary: "Shows that are currently trending on TMDb."
    sort_title: "!03_Trending_Shows"
    collection_order: random
    sync_mode: sync                         # exactly the list (the global default is append: the row would grow past 40)
    visible_home: true
    visible_library: true
    visible_shared: true
    file_poster: config/winswatch/cards/trending-shows.png
    mdblist_list:
      url: https://mdblist.com/lists/hawklet2025/trending-shows
      limit: 40
