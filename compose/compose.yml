  #     - ${APPDATA_ROOT}/govee2mqtt:/data
  #   depends_on:
  #     - mosquitto
  #     - homeassistant

  # ---------------------------------------------------------------------------
  # OBSERVABILITY
  # ---------------------------------------------------------------------------

  influxdb:
    image: influxdb:1.8
    container_name: influxdb
    restart: unless-stopped
    networks:
      - apps
    ports:
      - "8086:8086"
    environment:
      - TZ=${TZ}
      - INFLUXDB_DB=${INFLUXDB_DB:-homelab}
      - INFLUXDB_ADMIN_USER=${INFLUXDB_ADMIN_USER:-admin}
      - INFLUXDB_ADMIN_PASSWORD=${INFLUXDB_ADMIN_PASSWORD}
    volumes:
      - ${APPDATA_ROOT}/influxdb:/var/lib/influxdb

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    networks:
      - proxy
      - apps
    environment:
      - TZ=${TZ}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://grafana.${BASE_DOMAIN}}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    volumes:
      - ${APPDATA_ROOT}/grafana:/var/lib/grafana
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${BASE_DOMAIN}`)"
      - "traefik.http.routers.grafana.entrypoints=web"
      - "traefik.http.routers.grafana.service=grafana"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
    depends_on:
      - influxdb

  nut-influxdb-exporter:
    image: maihai/nut-influxdb-exporter:latest
    container_name: nut-influxdb-exporter
    restart: unless-stopped
    networks:
      - apps
    environment:
      - TZ=${TZ}
      - NUT_HOST=${NUT_HOST:-localhost}
      - NUT_PORT=${NUT_PORT:-3493}
      - INFLUXDB_HOST=influxdb
      - INFLUXDB_PORT=8086
      - INFLUXDB_DATABASE=${INFLUXDB_DB:-homelab}
    depends_on:
      - influxdb

  librespeed:
    image: ghcr.io/librespeed/speedtest:latest
    container_name: librespeed
    restart: unless-stopped
    networks:
      - proxy
    environment:
      - MODE=standalone
      - TELEMETRY=false
      - TITLE=Home Lab Speed Test
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.librespeed.rule=Host(`speedtest.${BASE_DOMAIN}`)"
      - "traefik.http.routers.librespeed.entrypoints=web"
      - "traefik.http.routers.librespeed.service=librespeed"
      - "traefik.http.services.librespeed.loadbalancer.server.port=80"
