# =============================================================================
# Home Lab Docker Compose - LOCAL Testing Override
# =============================================================================
# This file adds local-specific configurations:
# - Local DNS container (dnsmasq) for *.local.lan resolution
# - Basic auth middleware enabled on all routers
# - Local port bindings as needed
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # LOCAL DNS - Resolves *.local.lan to Docker host
  # ---------------------------------------------------------------------------
  # NOTE: Port 53 is often used by systemd-resolved. Options:
  #   1. Use port 5353 and configure your system to use it
  #   2. Disable systemd-resolved (see docs/local-dns.md)
  #   3. Add entries to /etc/hosts instead
  # ---------------------------------------------------------------------------
  local-dns:
    image: jpillora/dnsmasq:latest
    container_name: local-dns
    restart: unless-stopped
    profiles:
      - dns  # Only start when explicitly requested with --profile dns
    ports:
      - "5353:53/udp"
      - "5353:53/tcp"
      - "5380:8080"  # Web UI for dnsmasq
    environment:
      - HTTP_USER=${LOCAL_BASIC_AUTH_USER:-admin}
      - HTTP_PASS=${LOCAL_DNS_WEB_PASSWORD:-admin}
    volumes:
      - ./dnsmasq/dnsmasq.conf:/etc/dnsmasq.conf:ro
    cap_add:
      - NET_ADMIN
    logging:
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # TRAEFIK - Add basic auth middleware to all routers
  # ---------------------------------------------------------------------------
  traefik:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik-dashboard.rule=Host(`traefik.${BASE_DOMAIN}`)"
      - "traefik.http.routers.traefik-dashboard.service=api@internal"
      - "traefik.http.routers.traefik-dashboard.entrypoints=web"
      - "traefik.http.routers.traefik-dashboard.middlewares=local-auth@file"

  # ---------------------------------------------------------------------------
  # GLUETUN / QBITTORRENT - Add basic auth middleware
