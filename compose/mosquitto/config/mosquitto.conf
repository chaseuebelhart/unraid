# =============================================================================
# Mosquitto MQTT Broker Configuration
# =============================================================================
# Eclipse Mosquitto 2.x configuration
# =============================================================================

# -----------------------------------------------------------------------------
# General Settings
# -----------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# Log to file and stdout
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# -----------------------------------------------------------------------------
# Default Listener (unencrypted, for internal Docker network)
# -----------------------------------------------------------------------------
listener 1883
protocol mqtt

# Allow anonymous connections (for internal Docker network only)
# For production, configure authentication
allow_anonymous true

# Alternatively, use password file for authentication:
# allow_anonymous false
# password_file /mosquitto/config/passwd

# -----------------------------------------------------------------------------
# WebSocket Listener (optional)
# -----------------------------------------------------------------------------
listener 9001
protocol websockets

# -----------------------------------------------------------------------------
# Connection Settings
# -----------------------------------------------------------------------------
max_connections -1
max_inflight_messages 20
max_queued_messages 1000
message_size_limit 0

# -----------------------------------------------------------------------------
# Security (for production, enable TLS)
# -----------------------------------------------------------------------------
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# require_certificate false
