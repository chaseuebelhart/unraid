# =============================================================================
# DNSMasq Configuration for Local Development
# =============================================================================
# Resolves *.local.lan to the Docker host
# =============================================================================

# Don't forward queries for local.lan to upstream
local=/local.lan/

# Resolve all *.local.lan to the Docker host gateway
# 172.17.0.1 is the default Docker bridge gateway
# Adjust if your Docker network uses a different gateway
address=/local.lan/172.17.0.1

# Upstream DNS servers (for non-local queries)
server=8.8.8.8
server=8.8.4.4
server=1.1.1.1

# Don't read /etc/resolv.conf
no-resolv

# Don't poll for changes
no-poll

# Enable logging
log-queries
log-facility=-

# Cache settings
cache-size=1000
no-negcache

# Listen on all interfaces
interface=*

# DHCP disabled (DNS only)
no-dhcp-interface=*
